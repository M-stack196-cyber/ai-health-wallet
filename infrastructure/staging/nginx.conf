# Two separate origins on one unprivileged nginx: doctor web (8080) and admin web (8081).
# TLS is terminated in front of this container (load balancer or host proxy, not yet provisioned); this file speaks HTTP only.
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $hw_scheme { default $scheme; https https; }

# Shared policy, repeated per server because add_header does not inherit once a location sets its own.
# connect-src 'self': the apps only call their own /api/. Documents are shown from blob: URLs.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/doctor;
  index index.html;
  client_max_body_size 6m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  # The doctor origin never forwards Admin routes.
  location /api/v1/admin/ { return 404; }
  location /api/ {
    set $api http://api:5000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $hw_scheme;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
  location / { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "no-referrer" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; try_files $uri /index.html; }
}
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/admin;
  index index.html;
  client_max_body_size 64k;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  # Admin is for /api/v1/admin/ only; patient, document and doctor routes are not reachable through this origin.
  location /api/v1/admin/ {
    set $api http://api:5000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $hw_scheme;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /api/ { return 404; }
  location / { try_files $uri /index.html; }
}
